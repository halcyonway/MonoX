# MonoX dev config — 本地默认配置。
# 路径用 ./ 开头，相对当前目录；也可用绝对路径。
# 第一次跑前先执行 scripts/install.sh 建 .monox 目录结构。

session_key = "default"

[llm]
api_base = "https://api.minimaxi.com/v1"
api_key = "${MINIMAX_API_KEY}"
model = "MiniMax-M2.7"
timeout = 60

[llm.extra_params]
# reasoning 模型需要把推理从 content 分离到独立字段
reasoning_split = true

[channel]
kind = "terminal"

[sandbox]
workspace_root = "./.monox/workspace"
memory_root    = "./.monox/memory"
skills_root    = "./.monox/skills"
tmp_root       = "./.monox/tmp"