# MonoX Configuration Template
# Copy this to config.toml and fill in your values.

session_key = "default"

channels_default = "feishu"

[llm]
api_base = "https://api.minimaxi.com/v1"
api_key = "${MINIMAX_API_KEY}"
model = "MiniMax-M2.7"
timeout = 120
provider_name = "minimax"

[llm.extra_params]
reasoning_split = true

[providers.official.MiniMax-M2.7]
model_real_name = "MiniMax-M2.7"
base_url = "https://api.minimaxi.com/v1"
apikey_env = "MINIMAX_API_KEY"
timeout = 240

[providers.official.MiniMax-M3]
model_real_name = "MiniMax-M3"
base_url = "https://api.minimaxi.com/v1"
apikey_env = "MINIMAX_API_KEY"
timeout = 240

[providers.official.GLM-5.3-Flash]
model_real_name = "GLM-5.3-Flash"
base_url = "https://open.bigmodel.cn/api/paas/v4/"
apikey_env = "ZHIPU_API_KEY"
timeout = 240

[llm.compression]
api_base = "https://api.minimaxi.com/v1"
api_key = "${MINIMAX_API_KEY}"
model = "MiniMax-Embedding-256"

[[channels]]
kind = "terminal"

[[channels]]
kind = "feishu"

[channels.feishu]
app_id = "${FEISHU_APP_ID}"
app_secret = "${FEISHU_APP_SECRET}"
allowed_chats = []

[sandbox]
workspace_root = "./.monox/workspace"
memory_root    = "./.monox/memory"
state_root     = "./.monox/state"
traces_root    = "./.monox/traces"
skills_root    = "./.monox/skills"
tmp_root       = "./.monox/tmp"
