# MonoX dev config — 请按需修改。
# api_key 用环境变量 OPENAI_API_KEY 注入，避免明文入库。

session_key = "default"

[llm]
api_base = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"   # 从环境变量读；启动前 export OPENAI_API_KEY=sk-xxx
model = "gpt-4"
timeout = 60

[channel]
kind = "terminal"

[sandbox]
workspace_root = "/var/agent/workspace"
memory_root    = "/var/agent/memory"
skills_root    = "/var/agent/skills"
tmp_root       = "/var/agent/tmp"