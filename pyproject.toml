[project]
name = "monox"
version = "0.1.0"
description = "MonoX: minimal agent runtime core"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "lark-oapi>=1.2",
    "prompt-toolkit>=3.0.53",
    "pypdf>=4.0",
    "rich>=15.0.0",
    "textual>=0.80",
    "tomli>=2.0; python_version < '3.11'",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 默认跳过慢测试（hang 或 sleep 长）。需要全跑用 `pytest -m ""`，
# 只跑慢的用 `pytest -m slow`。
addopts = "-m 'not slow'"
markers = [
    "slow: long-running / hang-prone tests; skipped by default, opt in via `-m slow`",
]
