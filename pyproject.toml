[project]
name = "monox"
version = "0.1.0"
description = "MonoX: minimal agent runtime core"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "lark-oapi>=1.2",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "textual>=0.80",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true
