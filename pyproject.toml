[project]
name = "monox"
version = "0.1.0"
description = "MonoX: minimal agent runtime core"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]