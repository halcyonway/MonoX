# MonoX configuration example
# Copy to config.toml and edit.

session_key = "default"

# channels_default: default target channel when agent output has no <send> tag.
# MUST be defined before [llm] section (TOML requirement).
channels_default = "feishu"

[llm]
api_base = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"
model = "gpt-4"
timeout = 60

# [llm.options]
# temperature = 0.7
# max_tokens = 4096

# [llm.extra_params]
# reasoning_split = true

# [llm.custom]
# your_custom_field = "value"

# Required independent compression model (L2 conversation summarization).
# 这里填占位值即可；可填主模型同款，或换一个更便宜的模型。
# Missing fields fall back to the main [llm] values.
[llm.compression]
model = "your-compression-model"

[llm.compression.options]
temperature = 0.2

# ============================================================
# [[channels]] multi-channel configuration
# ============================================================
# New format, takes priority over [channel] single-channel config.
# channels_default must appear before [llm] (TOML requirement).
# Per-channel config lives in [channels.<kind>] sub-table.

# Single channel example:
# [[channels]]
# kind = "terminal"

# Multi-channel example (terminal for input + feishu for output):
# [[channels]]
# kind = "terminal"
#
# [[channels]]
# kind = "feishu"
# [channels.feishu]
# app_id     = "cli_xxxxxxxxxxxxxxxx"
# app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# allowed_chats = []

[[channels]]
kind = "terminal"

[[channels]]
kind = "feishu"

[channels.feishu]
app_id     = "cli_xxxxxxxxxxxxxxxx"
app_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
allowed_chats = []

# Desktop client channel (MonoDesk) — WebSocket server for the desktop client:
# [[channels]]
# kind  = "monodesk"
# host  = "127.0.0.1"
# port  = 8765
# model = "gpt-4"   # optional; echoed in the hello frame for the client's status bar

# ============================================================
# [sandbox] file system paths
# ============================================================
[sandbox]
workspace_root = "./.monox/workspace"
memory_root    = "./.monox/memory"
state_root     = "./.monox/state"
traces_root    = "./.monox/traces"
skills_root    = "./.monox/skills"
tmp_root       = "./.monox/tmp"
